<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ethio Bingo</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0d47a1;
            margin: 0;
            padding: 10px;
            color: white;
            text-align: center;
        }
        .container {
            max-width: 450px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1565c0;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        .balance-box {
            background: #ffb300;
            color: black;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
        }
        .refresh-btn {
            background: #0d47a1;
            color: white;
            border: 1px solid white;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .table-header {
            display: grid;
            grid-template-columns: 1.2fr 1.5fr 1fr 1.2fr 1.2fr;
            background: #e65100;
            padding: 8px;
            font-weight: bold;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 5px;
        }
        .row-item {
            display: grid;
            grid-template-columns: 1.2fr 1.5fr 1fr 1.2fr 1.2fr;
            background: #1e3a8a;
            padding: 10px;
            align-items: center;
            border-radius: 6px;
            margin-bottom: 6px;
            font-size: 13px;
            position: relative;
        }
        .play-btn {
            background: #d4af37;
            color: black;
            border: none;
            padding: 6px 14px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }
        .play-btn:hover {
            background: #c59b27;
        }
        .low-balance {
            color: #ffcccc;
            font-size: 12px;
        }
        .active-tag {
            position: absolute;
            top: -8px;
            left: 15px;
            background: #27ae60;
            color: white;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
        }
        /* የቦርድ ምርጫ ገጽ */
        #boardScreen {
            display: none;
            background: #9575cd;
            color: white;
            padding: 10px;
            border-radius: 10px;
        }
        .board-header {
            background: #512da8;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 14px;
        }
        .numbers-grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 3px;
            margin: 10px 0;
            max-height: 300px;
            overflow-y: auto;
        }
        .num-cell {
            background: #d1c4e9;
            color: black;
            padding: 8px 2px;
            font-size: 11px;
            border-radius: 3px;
            cursor: pointer;
            border: 1px solid #7e57c2;
        }
        .num-cell.selected {
            background: #e74c3c;
            color: white;
            font-weight: bold;
        }
        .board-actions {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
        }
        /* የጨዋታ ማዕከል (Game Interface) */
        #gameActiveScreen {
            display: none;
            background: #1a237e;
            padding: 10px;
            border-radius: 10px;
            text-align: left;
        }
        .game-top-bar {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            background: #283593;
            padding: 6px;
            border-radius: 5px;
            margin-bottom: 8px;
        }
        .bingo-card {
            background: white;
            color: black;
            padding: 8px;
            border-radius: 8px;
            text-align: center;
        }
        .bingo-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 5px;
        }
        .bingo-table th, .bingo-table td {
            border: 1px solid #ccc;
            padding: 6px;
            font-size: 12px;
        }
        .bingo-table th {
            background: #ffb300;
        }
        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #bbdefb;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 1. ዋናው የሎቢ ገጽ -->
        <div id="mainLobby">
            <div class="header">
                <div class="balance-box" id="userBalance">💳 0 ETB</div>
                <div style="font-size: 16px; font-weight: bold;">Ethio Bingo</div>
                <button class="refresh-btn" onclick="refreshData()">Refresh</button>
            </div>

            <div class="table-header">
                <div>Stake</div>
                <div>Status</div>
                <div>Players</div>
                <div>Derash</div>
                <div>Play</div>
            </div>

            <!-- 10 ብር ጨዋታ -->
            <div class="row-item">
                <div><b>10 ETB</b></div>
                <div id="status10">43s</div>
                <div id="players10">18</div>
                <div id="derash10">144 ETB</div>
                <td><button class="play-btn" onclick="selectStake(10)">Play</button></td>
            </div>

            <!-- 20 ብር ጨዋታ -->
            <div class="row-item">
                <div><b>20 ETB</b></div>
                <div id="status20">Ready</div>
                <div id="players20
