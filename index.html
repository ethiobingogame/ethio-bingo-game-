<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>እናቴ ቢንጎ (Ethio Bingo)</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #f4f4f9; margin: 0; padding: 20px; }
        .container { max-width: 450px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { color: #333; margin-bottom: 5px; }
        .stats { font-size: 15px; margin: 15px 0; background: #eef2f7; padding: 10px; border-radius: 8px; text-align: left; }
        .board { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 20px; }
        .cell { background: #e0e0e0; padding: 12px 0; font-size: 16px; font-weight: bold; cursor: pointer; border-radius: 6px; user-select: none; transition: 0.2s; }
        .cell:hover { background: #d0d0d0; }
        .cell.marked { background: #4CAF50; color: white; }
        .btn-action { background-color: #2196F3; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 6px; cursor: pointer; margin-bottom: 15px; width: 100%; font-weight: bold; }
        .btn-action:hover { background-color: #1976D2; }
        .btn-bingo { background-color: #ff9800; color: white; border: none; padding: 12px 20px; font-size: 18px; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%; }
        .btn-bingo:hover { background-color: #f57c00; }
        #message { margin-top: 15px; font-weight: bold; font-size: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h2>እናቴ ቢንጎ (Ethio Bingo)</h2>
    <p style="color: #666; font-size: 13px;">ከተመረጡት 200 የቢንጎ ቦርዶች አንዱ</p>
    
    <div class="stats">
        <p>👤 የተጫዋቾች ብዛት: <span id="player-count">0</span> ሰው</p>
        <p>💰 አጠቃላይ ሽልማት (Prize Pool): ብር <span id="prize-pool">0</span></p>
    </div>

    <button class="btn-action" onclick="joinGame()">ጨዋታውን ተቀላቀል (Join)</button>

    <!-- የቢንጎ ሰሌዳ (5x5) -->
    <div class="board" id="bingo-board"></div>

    <!-- የቢንጎ ማረጋገጫ ቁልፍ -->
    <button class="btn-bingo" onclick="checkBingo()">ቢንጎ (BINGO)!</button>
    
    <div id="message"></div>
</div>

<script>
    let markedNumbers = [];
    let userId = "user_" + Math.floor(Math.random() * 10000); // የተጠቃሚ መለያ

    // የቢንጎ ቦርድ ሳጥኖችን ማመንጨት (ከ 200 ቦርዶች ውስጥ የሚመረጥ)
    function generateBoard() {
        const boardDiv = document.getElementById('bingo-board');
        boardDiv.innerHTML = '';
        
        // የናሙና 25 ቁጥሮች (ፕሌቱኑ)
        const numbers = [4, 18, 25, 33, 41, 10, 15, 29, 37, 49, 8, 22, 'FREE', 40, 52, 3, 20, 31, 44, 58, 12, 26, 35, 48, 60];
        
        numbers.forEach(num => {
            const cell = document.createElement('div');
            cell.className = 'cell';
            cell.innerText = num;
            cell.onclick = () => {
                cell.classList.toggle('marked');
                if (cell.classList.contains('marked')) {
                    if (!markedNumbers.includes(num)) markedNumbers.push(num);
                } else {
                    markedNumbers = markedNumbers.filter(n => n !== num);
                }
            };
            boardDiv.appendChild(cell);
        });
    }

    // ጨዋታውን መቀላቀል እና የሰዎች ቁጥር/ባላንስ ማሳደግ
    function joinGame() {
        fetch('/api/join', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ user_id: userId })
        })
        .then(res => res.json())
        .then(data => {
            if (data.status === 'banned') {
                document.getElementById('message').style.color = 'red';
                document.getElementById('message').innerText = data.message;
            } else {
                document.getElementById('player-count').innerText = data.players_count;
                document.getElementById('prize-pool').innerText = data.prize_pool;
                document.getElementById('message').style.color = 'green';
                document.getElementById('message').innerText = "ጨዋታውን በተሳካ ሁኔታ ተቀላቅለዋል!";
            }
        });
    }

    // ቢንጎን ማረጋገጥ (አሸናፊ ወይም ቅጣት)
    function checkBingo() {
        fetch('/api/verify-bingo', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ user_id: userId, marked_numbers: markedNumbers })
        })
        .then(res => res.json())
        .then(data => {
            const msgDiv = document.getElementById('message');
            if (data.status === 'win') {
                msgDiv.style.color = 'green';
                msgDiv.innerText = data.message;
            } else {
                msgDiv.style.color = 'red';
                msgDiv.innerText = data.message;
            }
        });
    }

    generateBoard();
</script>

</body>
</html>
