<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>አራዳ ቢንጎ (Arada Bingo)</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0d47a1;
            margin: 0;
            padding: 10px;
            color: white;
            text-align: center;
        }
        .container {
            max-width: 450px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1565c0;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        .balance-box {
            background: #ffb300;
            color: black;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
        }
        .refresh-btn {
            background: #0d47a1;
            color: white;
            border: 1px solid white;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .table-header {
            display: grid;
            grid-template-columns: 1.2fr 1.5fr 1fr 1.2fr 1.2fr;
            background: #e65100;
            padding: 8px;
            font-weight: bold;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 5px;
        }
        .row-item {
            display: grid;
            grid-template-columns: 1.2fr 1.5fr 1fr 1.2fr 1.2fr;
            background: #1e3a8a;
            padding: 10px;
            align-items: center;
            border-radius: 6px;
            margin-bottom: 6px;
            font-size: 13px;
            position: relative;
        }
        .play-btn {
            background: #d4af37;
            color: black;
            border: none;
            padding: 6px 14px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }
        .play-btn:hover {
            background: #c59b27;
        }
        .low-balance {
            color: #ffcccc;
            font-size: 12px;
        }
        .active-tag {
            position: absolute;
            top: -8px;
            left: 15px;
            background: #27ae60;
            color: white;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
        }
        /* የቦርድ ምርጫ እና ጨዋታ ማሳያ */
        #gameScreen {
            display: none;
            background: #d1c4e9;
            color: black;
            padding: 15px;
            border-radius: 10px;
        }
        .numbers-grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 3px;
            margin: 10px 0;
        }
        .num-cell {
            background: #fff;
            padding: 8px 2px;
            font-size: 12px;
            border-radius: 3px;
            cursor: pointer;
            border: 1px solid #ccc;
        }
        .num-cell.selected {
            background: #e74c3c;
            color: white;
        }
        .action-btns {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
        }
        .btn-action {
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }
        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #bbdefb;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- ዋናው የጨዋታ ዝርዝር ገጽ -->
        <div id="mainLobby">
            <div class="header">
                <div class="balance-box" id="userBalance">💳 49 ETB</div>
                <div style="font-size: 16px; font-weight: bold;">Arada Bingo</div>
                <button class="refresh-btn" onclick="refreshData()">Refresh</button>
            </div>

            <div class="table-header">
                <div>Stake</div>
                <div>Status</div>
                <div>Players</div>
                <div>Derash</div>
                <div>Play</div>
            </div>

            <!-- 10 ብር ጨዋታ -->
            <div class="row-item">
                <div><b>10 ETB</b></div>
                <div>43s</div>
                <div>18</div>
                <div>144 ETB</div>
                <td><button class="play-btn" onclick="selectStake(10)">Play</button></td>
            </div>

            <!-- 20 ብር ጨዋታ -->
            <div class="row-item">
                <div><b>20 ETB</b></div>
                <div>Ready</div>
                <div>0</div>
                <div>0 ETB</div>
                <td><button class="play-btn" onclick="selectStake(20)">Play</button></td>
            </div>

            <!-- 50 ብር ጨዋታ (Low Balance የሚፈተሽበት) -->
            <div class="row-item">
                <div class="active-tag">Active game</div>
                <div><b>50 ETB</b></div>
                <div><span class="low-balance">Low balance</span></div>
                <div>69</div>
                <div>2720 ETB</div>
                <td><button class="play-btn" onclick="selectStake(50)">Play</button></td>
            </div>

            <div class="footer">© Arada Bingo 2025</div>
        </div>

        <!-- ቁጥር የሚመረጥበት ቦርድ ገጽ -->
        <div id="gameScreen">
            <h3 id="selectedStakeTitle">ውርርድ: 10 ብር</h3>
            <p>እባክዎ የሚፈልጉትን የቦርድ ቁጥር ይምረጡ (ከ1 እስከ 200)</p>
            
            <div class="numbers-grid" id="boardGrid">
                <!-- በጃቫስክሪፕት የሚሞላ -->
            </div>

            <div class="action-btns">
                <button class="btn-action" style="background:#e0e0e0;" onclick="goBack()">Back</button>
                <button class="btn-action" style="background:#27ae60; color:white;" onclick="startGame()">Start Game</button>
            </div>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let balance = 49; // የተጠቃሚው ቀሪ ሒሳብ
        let chosenStake = 10;

        function refreshData() {
            alert('መረጃው ታድሷል!');
        }

        function selectStake(stake) {
            chosenStake = stake;
            
            // ባላንስ ከውርርዱ ካነሰ (ለምሳሌ 50 ብር ለመጫወት ሞክሮ ባላንሱ 49 ከሆነ)
            if (balance < stake) {
                alert('❌ በቂ ቀሪ ሒሳብ የለዎትም (Low balance)! እባክዎ አካውንትዎ ላይ ገንዘብ ይሙሉ');
                return;
            }

            // ወደ ቦርድ መምረጫ ማሳያ መቀየር
            document.getElementById('mainLobby').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'block';
            document.getElementById('selectedStakeTitle').innerText = `የውርርድ መጠን: ${stake} ብር`;
            
            generateNumbersBoard();
        }

        function generateNumbersBoard() {
            const grid = document.getElementById('boardGrid');
            grid.innerHTML = '';
            for (let i = 1; i <= 200; i++) {
                const cell = document.createElement('div');
                cell.className = 'num-cell';
                cell.innerText = i;
                cell.onclick = function() {
                    // ቀድሞ የተመረጠውን በማጥፋት አንዱን ብቻ መምረጥ እንዲቻል
                    document.querySelectorAll('.num-cell').forEach(c => c.classList.remove('selected'));
                    cell.classList.add('selected');
                };
                grid.appendChild(cell);
            }
        }

        function goBack() {
            document.getElementById('gameScreen').style.display = 'none';
            document.getElementById('mainLobby').style.display = 'block';
        }

        function startGame() {
            const selectedCell = document.querySelector('.num-cell.selected');
            if (!selectedCell) {
                alert('እባክዎ መጀመሪያ የቦርድ ቁጥር ይምረጡ!');
                return;
            }
            alert(`በተሳካ ሁኔታ የቦርድ ቁጥር ${selectedCell.innerText} በመምረጥ ጨዋታውን ጀምረዋል!`);
            // ወደ ዋናው የጨዋታ ሂደት የሚወስደውን ኮድ እዚህ ማካተት ይቻላል
        }
    </script>
</body>
</html>
