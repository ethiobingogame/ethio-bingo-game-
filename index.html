<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ኢትዮ ቢንጎ ጌም (Ethio Bingo Game)</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 15px;
            text-align: center;
            color: #333;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h1 {
            color: #2c3e50;
            font-size: 22px;
            margin-bottom: 5px;
        }
        .info-box {
            display: flex;
            justify-content: space-between;
            background: #eef2f3;
            padding: 10px;
            border-radius: 8px;
            margin: 10px 0;
            font-size: 14px;
            font-weight: bold;
        }
        .balance {
            font-size: 16px;
            margin: 10px 0;
            font-weight: bold;
            color: #27ae60;
        }
        .stake-section {
            margin: 10px 0;
            font-size: 14px;
        }
        .stake-select {
            padding: 6px;
            font-size: 14px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        .bingo-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
            margin: 15px 0;
        }
        .cell {
            background: #ecf0f1;
            padding: 12px 0;
            font-size: 14px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            user-select: none;
            transition: background 0.2s;
        }
        .cell.selected {
            background: #2ecc71;
            color: white;
        }
        .btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 15px;
            margin: 6px 0;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
            width: 100%;
            font-weight: bold;
        }
        .btn:hover {
            background-color: #2980b9;
        }
        .btn-withdraw {
            background-color: #e67e22;
        }
        .btn-withdraw:hover {
            background-color: #d35400;
        }
        .btn-bingo {
            background-color: #27ae60;
        }
        .btn-bingo:hover {
            background-color: #219653;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>ኢትዮ ቢንጎ ጌም 🎮</h1>
        
        <div class="info-box">
            <span>👥 ተጫዋቾች: <b id="activePlayers">12</b></span>
            <span>💰 ደራሽ: <b id="derashAmount">240.00 ብር</b></span>
        </div>

        <div class="balance" id="balanceDisplay">ቀሪ ሒሳብ: 0.00 ብር</div>

        <div class="stake-section">
            <label for="stakeSelect">የውርርድ መጠን (Stake): </label>
            <select id="stakeSelect" class="stake-select" onchange="updateStake()">
                <option value="10">10 ብር</option>
                <option value="20">20 ብር</option>
                <option value="50">50 ብር</option>
                <option value="100">100 ብር</option>
            </select>
        </div>

        <div class="bingo-grid" id="bingoBoard">
            <!-- የቢንጎ ሳጥኖች በ JS ይሞላሉ -->
        </div>

        <button class="btn btn-bingo" onclick="checkBingo()">🎉 ቢንጎ ማረጋገጫ (Bingo!)</button>
        <button class="btn" onclick="makeDeposit()">💳 ዲፖዚት (ገንዘብ ማስገባት)</button>
        <button class="btn btn-withdraw" onclick="requestWithdraw()">💸 ገንዘብ ማውጣት (Withdraw)</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let userBalance = 0.00;
        let currentStake = 10;

        function updateUI() {
            document.getElementById('balanceDisplay').innerText = `ቀሪ ሒሳብ: ${userBalance.toFixed(2)} ብር`;
        }

        function updateStake() {
            currentStake = parseFloat(document.getElementById('stakeSelect').value);
        }

        // የቢንጎ ሰሌዳ በዘፈቀደ ቁጥሮች መሙላት
        function generateBoard() {
            const board = document.getElementById('bingoBoard');
            board.innerHTML = '';
            for (let i = 1; i <= 25; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.innerText = Math.floor(Math.random() * 75) + 1;
                cell.onclick = function() {
                    cell.classList.toggle('selected');
                };
                board.appendChild(cell);
            }
        }

        function makeDeposit() {
            const amountStr = prompt("ስንት ብር ዲፖዚት ማድረግ ይፈልጋሉ?", "100");
            if (amountStr) {
                let amount = parseFloat(amountStr);
                if (!isNaN(amount) && amount > 0) {
                    fetch('/api/deposit', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ amount: amount, user_id: tg.initDataUnsafe?.user?.id || 'test_user' })
                    })
                    .then(res => res.json())
                    .then(data => {
                        if(data.success) {
                            userBalance += amount;
                            updateUI();
                            alert(data.message);
                        } else {
                            alert(data.message || 'ተቀማጭ ማድረግ አልተቻለም');
                        }
                    })
                    .catch(err => console.error('Error:', err));
                } else {
                    alert('እባክዎ ትክክለኛ የገንዘብ መጠን ያስገቡ!');
                }
            }
        }

        function requestWithdraw() {
            const amountStr = prompt("ስንት ብር ማውጣት (Withdraw) ይፈልጋሉ?", "50");
            if (amountStr) {
                let amount = parseFloat(amountStr);
                if (!isNaN(amount) && amount > 0) {
                    if (amount <= userBalance) {
                        fetch('/api/withdraw', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ amount: amount, user_id: tg.initDataUnsafe?.user?.id || 'test_user' })
                        })
                        .then(res => res.json())
                        .then(data => {
                            if(data.success) {
                                userBalance -= amount;
                                updateUI();
                                alert(data.message);
                            } else {
                                alert(data.message || 'ማውጣት አልተቻለም');
                            }
                        })
                        .catch(err => console.error('Error:', err));
                    } else {
                        alert('የካርቱን/ሒሳብ መጠን ከቀሪ ሒሳብዎ ሊበልጥ አይችልም!');
                    }
                } else {
                    alert('እባክዎ ትክክለኛ መጠን ያስገቡ!');
                }
            }
        }

        function checkBingo() {
            fetch('/api/check-bingo', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ is_valid: true, stake: currentStake, user_id: tg.initDataUnsafe?.user?.id || 'test_user' })
            })
            .then(res => res.json())
            .then(data => {
                if(data.isBingo) {
                    userBalance += data.prize;
                    updateUI();
                    alert('🎉 እንኳን ደስ አለዎት! ቢንጎ ትክክል ነው! ሽልማትዎ: ' + data.prize + ' ብር');
                } else {
                    alert('❌ ቢንጎው ትክክል አይደለም ወይም አልተሳካም');
                }
            })
            .catch(err => console.error('Error:', err));
        }

        generateBoard();
        updateUI();
    </script>
</body>
</html>
