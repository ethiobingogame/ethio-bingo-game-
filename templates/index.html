<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>እናቴ ቢንጎ - Telegram Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 15px;
            text-align: center;
        }
        .header {
            background: #1e293b;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .stakes-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        .stake-card {
            background: #334155;
            padding: 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }
        .stake-card:hover {
            background: #475569;
        }
        .board-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
            max-width: 400px;
            margin: 0 auto 20px auto;
        }
        .board-cell {
            background: #1e293b;
            padding: 12px;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
        }
        .board-cell.selected {
            background: #2563eb;
        }
        button {
            background: #22c55e;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background: #16a34a;
        }
        .hidden { display: none; }
    </style>
</head>
<body>

    <!-- የ ከፍ ያለ ክፍል (Profile & Balance) -->
    <div class="header">
        <div><span id="username">ተጠቃሚ</span></div>
        <div>ባላንስ: <span id="balance">100.0</span> ETB</div>
    </div>

    <!-- 1. ስቴኮች መምረጫ ክፍል -->
    <div id="stakes-section">
        <h3>ስቴኮች ይምረጡ</h3>
        <div class="stakes-container" id="stakes-list">
            <!-- በጃቫስክሪፕት በዳይናሚክ ይሞላል -->
        </div>
    </div>

    <!-- 2. ቦርድ ምርጫ (ከ 1 እስከ 200) -->
    <div id="board-section" class="hidden">
        <h3 id="selected-stake-title">ቦርድ ይምረጡ (ከ 1 እስከ 200)</h3>
        <input type="number" id="boardNumberInput" min="1" max="200" placeholder="የቦርድ ቁጥር (1-200)" style="padding: 8px; font-size: 16px; width: 200px; margin-bottom: 15px;">
        <br>
        <button onclick="selectBoard()">ቦርዱን ይውሰዱ</button>
    </div>

    <!-- 3. የጨዋታ ውስጥ ማሳያ እና የድል ማረጋገጫ -->
    <div id="game-section" class="hidden">
        <h3>ጨዋታው በሂደት ላይ ነው...</h3>
        <p id="timer">ሰዓት ቆጣሪ: 30 ሰኮንድ</p>
        <div class="board-grid" id="user-board-grid"></div>
        <button onclick="checkWin()">Bingo! (አሸንፌአለሁ)</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let telegram_id = tg.initDataUnsafe?.user?.id || "12345678";
        let username = tg.initDataUnsafe?.user?.first_name || "ተጠቃሚ";
        let currentStake = 10;
        let selectedBoardIndex = 0;

        // መተግበሪያው ሲከፈት ዩዘር መመዝገብ/ማምጣት
        fetch('/api/user', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({telegram_id: telegram_id, username: username})
        })
        .then(res => res.json())
        .then(data => {
            document.getElementById('username').innerText = data.user.username;
            document.getElementById('balance').innerText = data.user.balance;
        });

        // ስቴኮችን እና ዳይናሚክ ተጫዋቾችን መጫን
        function loadStakes() {
            fetch('/api/stakes')
            .then(res => res.json())
            .then(data => {
                let container = document.getElementById('stakes-list');
                container.innerHTML = '';
                for (let stake in data) {
                    container.innerHTML += `
                        <div class="stake-card" onclick="openBoardSelection(${stake})">
                            <h4>${stake} ETB</h4>
                            <p>ተጫዋቾች: ${data[stake].players}</p>
                            <p>ድራሽ: ${data[stake].derash} ETB</p>
                        </div>
                    `;
                }
            });
        }
        loadStakes();
        setInterval(loadStakes, 5000); // በየ 5 ሰከንዱ ዳይናሚክ ማስተካከያ

        function openBoardSelection(stake) {
            currentStake = stake;
            document.getElementById('stakes-section').classList.add('hidden');
            document.getElementById('board-section').classList.remove('hidden');
        }

        // ቦርድ መምረጥ
        function selectBoard() {
            let boardNum = document.getElementById('boardNumberInput').value;
            if(!boardNum || boardNum < 1 || boardNum > 200) {
                alert("እባክዎ ከ 1 እስከ 200 ያለ ቁጥር ያስገቡ!");
                return;
            }

            fetch('/api/select_board', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    telegram_id: telegram_id,
                    stake: currentStake,
                    board_number: boardNum
                })
            })
            .then(res => res.json())
            .then(data => {
                if(data.status === 'success') {
                    document.getElementById('balance').innerText = data.balance;
                    alert(data.message);
                    
                    // ወደ ጨዋታው ማሳያ መቀየር
                    document.getElementById('board-section').classList.add('hidden');
                    document.getElementById('game-section').classList.remove('hidden');
                    
                    let grid = document.getElementById('user-board-grid');
                    grid.innerHTML = '';
                    data.board.numbers.forEach(num => {
                        grid.innerHTML += `<div class="board-cell">${num}</div>`;
                    });
                } else {
                    alert(data.message);
                }
            });
        }

        // የቢንጎ ድል ማረጋገጫ
        function checkWin() {
            fetch('/api/check_win', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({telegram_id: telegram_id, board_index: 0})
            })
            .then(res => res.json())
            .then(data => {
                alert(data.message);
                if(data.new_balance) {
                    document.getElementById('balance').innerText = data.new_balance;
                }
                // ወደ ዋናው ገጽ መመለስ
                document.getElementById('game-section').classList.add('hidden');
                document.getElementById('stakes-section').classList.remove('hidden');
            });
        }
    </script>
</body>
</html>
